<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السرية - Forelle</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-modal" class="login-container">
        <div class="login-box">
            <h2><i class="fa-solid faل-lock"></i> لوحة التحكم</h2>
            <p>أدخل كلمة المرور السرية للمتابعة</p>
            <input type="password" id="admin-password" placeholder="كلمة المرور">
            <button onclick="checkPassword()">دخول</button>
            <a href="index.html" class="back-home">العودة للموقع الرئيسي</a>
        </div>
    </div>

    <!-- محتوى لوحة التحكم (يظهر بعد كلمة المرور الصحيحة) -->
    <div id="admin-dashboard" class="dashboard" style="display: none;">
        <header class="admin-header">
            <h1>إدارة متجر Forelle</h1>
            <a href="index.html" class="view-site"><i class="fa-solid fa-globe"></i> عرض الموقع</a>
        </header>

        <div class="admin-content">
            <!-- نموذج إضافة منتج جديد -->
            <div class="form-card">
                <h2>إضافة حقيبة أو منتج جديد</h2>
                <form id="add-product-form" onsubmit="addProduct(event)">
                    <div class="input-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="product-name" required placeholder="مثال: حقيبة جلدية فاخرة">
                    </div>
                    <div class="input-group">
                        <label>السعر (دج)</label>
                        <input type="number" id="product-price" required placeholder="مثال: 5500">
                    </div>
                    <div class="input-group">
                        <label>رابط الصورة (Image URL)</label>
                        <input type="url" id="product-img" required placeholder="رابط صورة المنتج">
                    </div>
                    <button type="submit" class="btn-save">حفظ وإضافة للمتجر</button>
                </form>
            </div>

            <!-- قائمة المنتجات الحالية للحذف أو الإدارة -->
            <div class="products-list-card">
                <h2>المنتجات الحالية في المتجر</h2>
                <div id="admin-products-list" class="admin-products-grid">
                    <!-- يتم جلب المنتجات برمجياً -->
                </div>
            </div>
        </div>
    </div>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Forelle</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Supabase وملف الاتصال الجديد -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
</head>
<body>
    <header>
        <h1>متجر Forelle</h1>
    </header>
    <main>
        <div id="products-container" style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px;">
            <!-- المنتجات ستظهر هنا تلقائياً -->
        </div>
    </main>
    <script>
        async function loadProducts() {
            const container = document.getElementById('products-container');
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                container.innerHTML = '<p>خطأ في جلب المنتجات: ' + error.message + '</p>';
                return;
            }
            if (data.length === 0) {
                container.innerHTML = '<p>لا توجد منتجات حالياً.</p>';
                return;
            }
            container.innerHTML = data.map(p => `
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 200px;">
                    <img src="${p.image_url || 'https://via.placeholder.com/150'}" alt="${p.name}" style="width:100%; height:150px; object-fit:cover;">
                    <h3>${p.name}</h3>
                    <p>${p.price} دج</p>
                </div>
            `).join('');
        }
        loadProducts();
    </script>
</body>
</html>
